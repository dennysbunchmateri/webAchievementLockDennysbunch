  :root{
    --blue:#1b3faa;
    --red:#e2231a;
    --yellow:#e8c400;
    --lightblue:#bcd4ef;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Georgia', 'Times New Roman', serif;
    background:#e9e9ec;
    color:#222;
  }
  #app{
    max-width:850px;
    margin:0 auto;
    padding:10px;
  }
  .navbar{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    background:#fff;
    border-radius:10px;
    padding:10px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    position:sticky;
    top:10px;
    z-index:50;
  }
  .navbtn{
    font-family:Arial, sans-serif;
    font-size:12.5px;
    padding:8px 12px;
    border:1px solid #ddd;
    background:#f7f7f9;
    border-radius:20px;
    cursor:pointer;
    color:#333;
  }
  .navbtn.active{
    background:var(--blue);
    color:#fff;
    border-color:var(--blue);
  }
  .page{
    background:#fff;
    box-shadow:0 2px 14px rgba(0,0,0,.18);
    width:100%;
    max-width:210mm;
    aspect-ratio:210/297;
    height:auto;
    padding:6vw 5vw;
    margin:0 auto 28px auto;
    display:none;
    position:relative;
    overflow:visible;
    box-sizing:border-box;
    font-size:12px;
  }

<body>
<div id="app">
  <div class="navbar" id="navbar"></div>
  <div id="pages"></div>
</div>
<div class="savestatus" id="saveStatus">Tersimpan</div>

<script>
const STORAGE_KEY = "achievement-lock-data-v1";

const defaultData = () => ({
  identitas:{name:"", class:"", teacher:""},
  learningMaterial:{name:"", teacher:"", class:"", semester:"", academicYear:"", topics:Array(10).fill("")},
  lessonPlans:[
    {label:"Lesson Plan 1", penyusun:"", kelas:"", tema:"", semester:"1", rows:[emptyLPRow(),emptyLPRow(),emptyLPRow(),emptyLPRow()]},
    {label:"Lesson Plan 2", penyusun:"", kelas:"", tema:"", semester:"1", rows:[emptyLPRow(),emptyLPRow(),emptyLPRow(),emptyLPRow()]},
    {label:"Lesson Plan 3", penyusun:"", kelas:"", tema:"", semester:"2", rows:[emptyLPRow(),emptyLPRow(),emptyLPRow(),emptyLPRow()]},
    {label:"Lesson Plan 4", penyusun:"", kelas:"", tema:"", semester:"2", rows:[emptyLPRow(),emptyLPRow(),emptyLPRow(),emptyLPRow()]}
  ],
  materiIndonesia:[
    newMateri("Materi 1"), newMateri("Materi 2"), newMateri("Materi 3"), newMateri("Materi 4"), newMateri("Materi 5")
  ],
  achievementRecords:[
    newAchievement("Record 1"), newAchievement("Record 2"), newAchievement("Record 3"), newAchievement("Record 4")
  ]
});
function emptyLPRow(){ return {material:"", steps:"", cp:"", sched1:"", sched2:""}; }
function newMateri(label){ return {label, name:"", teacher:"", class:"", semester:"", academicYear:"", topics:Array(10).fill(""), qr:Array(10).fill("")}; }
function emptyARRow(){ return {dm:"", topic:"", sentences:"", grade:"", sigT:"", sigG:"", note:""}; }
function newAchievement(label){ return {label, name:"", teacher:"", class:"", smstr:"", rows:Array.from({length:8},emptyARRow)}; }

let data = defaultData();
let activeLP = 0;
let activeMateri = 0;
let activeAR = 0;

const pagesDef = [
  {id:"cover", label:"Cover"},
  {id:"identitas", label:"Identitas"},
  {id:"preface", label:"Kata Pengantar"},
  {id:"materiajar", label:"Materi Ajar"},
  {id:"nilai", label:"Nilai (KKTP)"},
  {id:"learning", label:"Learning Material"},
  {id:"lessonplan", label:"Lesson Plan"},
  {id:"materi", label:"Materi (Bhs Indonesia)"},
  {id:"achievement", label:"Achievement Record"},
  {id:"cover-gray", label:"Cover (Abu-abu)"}
];
let currentPage = "cover";

function saveData(){
  const status = document.getElementById('saveStatus');
  window.storage.set(STORAGE_KEY, JSON.stringify(data), false)
    .then(()=>{
      status.textContent = "Tersimpan";
      status.classList.add('show');
      setTimeout(()=>status.classList.remove('show'), 1200);
    })
    .catch(()=>{
      status.textContent = "Gagal menyimpan";
      status.classList.add('show');
    });
}
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveData, 500);
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const loaded = JSON.parse(res.value);
      data = Object.assign(defaultData(), loaded);
      if(!data.lessonPlans || !data.lessonPlans.length) data.lessonPlans=defaultData().lessonPlans;
      if(!data.materiIndonesia || !data.materiIndonesia.length) data.materiIndonesia=defaultData().materiIndonesia;
      if(!data.achievementRecords || !data.achievementRecords.length) data.achievementRecords=defaultData().achievementRecords;
    }
  }catch(e){
    // no existing data yet, use defaults
  }
  renderAll();
}

function renderAll(){
  renderNav();
  renderPages();
}

function renderNav(){
  const nav = document.getElementById('navbar');
  nav.innerHTML = "";
  pagesDef.forEach(p=>{
    const b = document.createElement('button');
    b.className = 'navbtn' + (p.id===currentPage ? ' active':'');
    b.textContent = p.label;
    b.onclick = ()=>{ currentPage = p.id; renderAll(); };
    nav.appendChild(b);
  });
}

function renderPages(){
  const container = document.getElementById('pages');
  container.innerHTML = "";
  pagesDef.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'page' + (p.id===currentPage ? ' show':'');
    div.id = 'page-'+p.id;
    div.innerHTML = renderPageContent(p.id);
    container.appendChild(div);
  });
  attachHandlers();
}

function renderPageContent(id){
  switch(id){
    case 'cover': return coverHTML();
    case 'cover-gray': return coverGrayHTML();
    case 'identitas': return identitasHTML();
    case 'preface': return prefaceHTML();
    case 'materiajar': return materiAjarHTML();
    case 'nilai': return nilaiHTML();
    case 'learning': return learningHTML();
    case 'lessonplan': return lessonPlanHTML();
    case 'materi': return materiHTML();
    case 'achievement': return achievementHTML();
    default: return "";
  }
}

function prefaceHTML(){
  return `
  <div class="textpage">
    <h2>Preface</h2>
    <p>Buku <b>ACHIEVEMENT LOCK</b> merupakan buku penghubung siswa, guru dan wali murid Denny's Bunch yang berkait dengan:</p>
    <ol>
      <li>Data Siswa</li>
      <li>Silabus 1 tahun akademik</li>
      <li>Materi ajar dan teknik penilaian</li>
      <li>Kemajuan belajar (Progress Report)</li>
      <li>Catatan Instruktur dan Wali Murid</li>
    </ol>
    <p>Sebagai buku penghubung, <b>ACHIEVEMENT LOCK</b> akan membawa fungsi maksimal pada interaksi antara siswa, guru dan wali murid Denny's Bunch manakala baik siswa, guru maupun wali murid Denny's Bunch secara tertib menjadikan sebagai pedoman guna capaian pembelajaran yang telah direncanakan.</p>
    <p>Tata cara memaksimalkan manfaat ACHIEVEMENT LOCK :</p>
    <ol>
      <li>Selalu membaca informasi yang ada di catatan instruktur dan wali murid, serta menyimak info di whatsapp grup.</li>
      <li>Mengomunikasikan secara imbal balik antara siswa, guru dan wali murid tentang keadaan; kendala, tantangan, harapan, ide, masukan, guna memperoleh kemajuan pembelajaran sesuai dengan yang telah direncanakan.</li>
      <li>Menjadikan sebagai panduan untuk orang tua wali murid didalam membersamai ananda belajar di rumah (panduan materi bahasa inggris disampaikan secara lisan di whatsapp grup kelas).</li>
      <li>Selalu membuka dan baca buku achievement lock dan mengikuti komunikasi lisan di whatsapp grup.</li>
    </ol>
    <p>Buku penghubung <b>ACHIEVEMENT LOCK</b> menjadi 1 (satu) paket alat/piranti dengan grup WhatsApp kelas yang dibentuk oleh masing2 instruktur kelas yang harus selalu dibaca dan disimak.</p>

function materiAjarHTML(){
  return `
  <div class="textpage">
    <h2>MATERI AJAR<br><span style="font-weight:normal;font-size:14px;">( LEARNING MATERIAL )</span></h2>
    <p>Materi ajar disusun dengan merujuk pada bahasa Inggris sehari-hari yang disesuaikan dengan tahapan usia serta tingkat pendidikan formal siswa. Karena capaiannya adalah kemampuan berkomunikasi bahasa Inggris secara aktif maka proses pembelajarannya harus berpedoman pada berapa banyak siswa bisa berbicara tema yang sedang dipelajari pada hari itu, <b>bukan</b> berapa banyak siswa tahu bahasa yang dipelajari.</p>
    <p>Proses pembelajaran diselenggarakan melalui meniru keberhasilan bayi dalam akuisisi bahasa ibu mereka. <b>Bayi belum bisa membaca</b>, dan juga <b>belum bisa berfikir secara logika</b>, namun dalam tempo maksimal 2 (dua) tahun bayi sudah bisa berbicara secara sederhana untuk menyampaikan kehendak dan keinginannya. Hal ini menunjukkan bahwa dengan cara yang benar maka tidak ada satupun bayi normal yang tidak bisa berbahasa ibu mereka.</p>
    <p>Dengan cara yang sama dengan yang dilakukan bayi, maka cara/gaya/model belajar bayi diadopsi oleh Denny's Bunch menjadi metode belajar mengajar dan kami beri nama sebagai <b>Baby's Method</b>.</p>
    <p>Cara/gaya/model belajar bayi dalam belajar bahasa ibu mereka dilakukan secara runtut atau urut, yang meliputi sbb:</p>
    <ol>
      <li>Mendengar</li>
      <li>Menirukan</li>
      <li>Menulis</li>
      <li>Membaca/menyimak</li>
    </ol>
    <p>Empat langkah proses belajar bahasa yang runtut itu disebut sebagai hierarki akuisisi bahasa (language acquisition hierarchy) yang urutannya alami, sehingga tidak bisa dibolak balik.</p>
    <p style="text-align:center;"><b>TEKNIK PENILAIAN</b><br><i>(Assessment Techniques)</i></p>
    <p>Automatic assessment (penilaian secara otomatis) diukur dari jumlah kalimat yang mampu disampaikan oleh siswa secara lisan dan otomatis (refleks) pada setiap pertemuan (meet).</p>
    <p>Pada 1 (satu) tema materi direncanakan sejumlah maksimal 10 kalimat. Ketuntasan dalam satu kali pertemuan berada pada rentang 3 sampai dengan 10 kalimat aktif yang mampu disampaikan secara reflek, disesuaikan dengan:</p>
    <ol>
      <li>Level atau tingkatan Sekolah</li>
      <li>Level atau tingkatan kelas</li>
      <li>Bobot materi pada tema yang dibahas.</li>
    </ol>
    <p>Berdasar penjelasan diatas, maka kriteria ketercapaian tujuan pembelajaran (KKTP) adalah sebagai berikut:</p>
  </div>`;
}

function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function setByPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    cur = cur[parts[i]];
  }
  cur[parts[parts.length-1]] = value;
}

function attachHandlers(){
  document.querySelectorAll('[data-field]').forEach(el=>{
    const evt = el.tagName==='TEXTAREA' || el.tagName==='INPUT' ? 'input' : 'change';
    el.addEventListener(evt, ()=>{
      setByPath(data, el.getAttribute('data-field'), el.value);
      scheduleSave();
    });
  });

  const addLP = document.getElementById('addLP');
  if(addLP) addLP.onclick = ()=>{
    const n = data.lessonPlans.length+1;
    data.lessonPlans.push({label:"Lesson Plan "+n, penyusun:"", kelas:"", tema:"", semester:"", rows:[emptyLPRow(),emptyLPRow(),emptyLPRow(),emptyLPRow()]});
    activeLP = data.lessonPlans.length-1;
    scheduleSave();
    renderPages();
  };
  const addLPRow = document.getElementById('addLPRow');
  if(addLPRow) addLPRow.onclick = ()=>{
    data.lessonPlans[activeLP].rows.push(emptyLPRow());
    scheduleSave();
    renderPages();
  };
  document.querySelectorAll('[data-lpselect]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeLP = parseInt(el.getAttribute('data-lpselect')); renderPages(); });
  });
  document.querySelectorAll('[data-lpdel]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(el.getAttribute('data-lpdel'));
      if(data.lessonPlans.length<=1){ return; }
      data.lessonPlans.splice(idx,1);
      if(activeLP>=data.lessonPlans.length) activeLP = data.lessonPlans.length-1;
      scheduleSave();
      renderPages();
    });
  });

  const addMateri = document.getElementById('addMateri');
  if(addMateri) addMateri.onclick = ()=>{
    const n = data.materiIndonesia.length+1;
    data.materiIndonesia.push(newMateri("Materi "+n));
    activeMateri = data.materiIndonesia.length-1;
    scheduleSave();
    renderPages();
  };
  document.querySelectorAll('[data-mselect]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeMateri = parseInt(el.getAttribute('data-mselect')); renderPages(); });
  });
  document.querySelectorAll('[data-qrupload]').forEach(el=>{
    el.addEventListener('change', (e)=>{
      const file = el.files && el.files[0];
      if(!file) return;
      if(file.size > 1024*1024*2){
        alert("Ukuran gambar QR terlalu besar, pakai yang di bawah 2MB ya.");
        return;
      }
      const [mIdx, tIdx] = el.getAttribute('data-qrupload').split('.').map(Number);
      const reader = new FileReader();
      reader.onload = ()=>{
        if(!data.materiIndonesia[mIdx].qr) data.materiIndonesia[mIdx].qr = Array(10).fill("");
        data.materiIndonesia[mIdx].qr[tIdx] = reader.result;
        scheduleSave();
        renderPages();
      };
      reader.readAsDataURL(file);
    });
  });
  document.querySelectorAll('[data-qrremove]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const [mIdx, tIdx] = el.getAttribute('data-qrremove').split('.').map(Number);
      data.materiIndonesia[mIdx].qr[tIdx] = "";
      scheduleSave();
      renderPages();
    });
  });
  document.querySelectorAll('[data-mdel]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(el.getAttribute('data-mdel'));
      if(data.materiIndonesia.length<=1){ return; }
      data.materiIndonesia.splice(idx,1);
      if(activeMateri>=data.materiIndonesia.length) activeMateri = data.materiIndonesia.length-1;
      scheduleSave();
      renderPages();
    });
  });

  const addAR = document.getElementById('addAR');
  if(addAR) addAR.onclick = ()=>{
    const n = data.achievementRecords.length+1;
    data.achievementRecords.push(newAchievement("Record "+n));
    activeAR = data.achievementRecords.length-1;
    scheduleSave();
    renderPages();
  };
  const addARRow = document.getElementById('addARRow');
  if(addARRow) addARRow.onclick = ()=>{
    data.achievementRecords[activeAR].rows.push(emptyARRow());
    scheduleSave();
    renderPages();
  };
  document.querySelectorAll('[data-arselect]').forEach(el=>{
    el.addEventListener('click', ()=>{ activeAR = parseInt(el.getAttribute('data-arselect')); renderPages(); });
  });
  document.querySelectorAll('[data-ardel]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(el.getAttribute('data-ardel'));
      if(data.achievementRecords.length<=1){ return; }
      data.achievementRecords.splice(idx,1);
      if(activeAR>=data.achievementRecords.length) activeAR = data.achievementRecords.length-1;
      scheduleSave();
      renderPages();
    });
  });
}
